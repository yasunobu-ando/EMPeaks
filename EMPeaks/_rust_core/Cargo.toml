[package]
name = "empeaks_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "empeaks_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3   = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy  = "0.22"
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = true
