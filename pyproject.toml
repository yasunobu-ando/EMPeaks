[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "empeaks"
version = "3.0.0"
authors = [{name = "Yasunobu Ando", email = "yasunobu.ando@cls.iir.isct.ac.jp"}]
description = "high-throughput spectrum peak modeling tools by using Spectrum adapted EM algorithms"
readme = "README.md"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pandas>=1.5.0",
    "streamlit>=1.28.0",
    "streamlit-aggrid>=0.3.3",
    "openpyxl>=3.0.0",
    "watchdog>=6.0.0",
]

[tool.maturin]
manifest-path = "EMPeaks/_rust_core/Cargo.toml"
python-packages = ["EMPeaks", "cli", "gui"]
features = ["pyo3/extension-module"]
data = "wheel_data"
