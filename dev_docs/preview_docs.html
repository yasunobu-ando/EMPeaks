# プロジェクト概要と利用方法

## 1. 概要 (Overview)
**EMPeaks** は、Spectrum Adapted EM (Expectation-Maximization) アルゴリズムを使用した高スループットなピーク解析パッケージです。
主にスペクトルデータ（XPSなど）のピーク分離やフィッティングに使用されます。

主な機能:
- **Gaussian Mixture Model (GMM)**: ガウス分布混合モデルによるフィッティング
- **Lorentzian Mixture Model (LMM)**: ローレンツ分布混合モデル
- **Background Subtraction**: バックグラウンド除去機能 (uniform, linear, ramp_sum)

## 2. ディレクトリ構造 (Directory Structure)

```mermaid
graph TD
    Root[EMPeaks Project] --> Src[EMPeaks/]
    Root --> Docs[docs/]
    Root --> DevDocs[dev_docs/]
    Root --> Demo[empeaks_demo.py]
    
    Src --> GMM[GaussianMixture/]
    Src --> LMM[LorentzianMixture/]
    Src --> Core[EMCore/]
    
    DevDocs --> Readme[README.md]
    DevDocs --> Overview[project_overview.md]
    DevDocs --> API[api_reference.md]
    
    style Root fill:#f9f,stroke:#333
    style Src fill:#bbf,stroke:#333
```

主なディレクトリとファイルの役割は以下の通りです。

- **`EMPeaks/`**: パッケージのソースコード本体。
    - `GaussianMixture.py`: ガウス混合モデルの実装。
    - `LorentzianMixture.py`: ローレンツ混合モデルの実装。
    - その他のモデルやユーティリティが含まれます。
- **`docs/`**: ドキュメントやチュートリアル（Jupyter Notebook形式）。
- **`dev_docs/`**: 開発者および運用補助のためのドキュメント（本ディレクトリ）。
- **`empeaks_demo.py`**: `marimo` を使用したインタラクティブなデモアプリケーション。
- **`requirements.txt`**: 依存ライブラリ一覧。
- **`setup.cfg` / `pyproject.toml`**: パッケージのビルド設定。

## 3. 利用方法 (Usage)

### 解析フロー
典型的な解析の流れは以下の通りです。

```mermaid
sequenceDiagram
    participant User as ユーザー
    participant Script as Pythonスクリプト
    participant Model as EMPeaksモデル
    
    User->>Script: データ(x, y)をロード
    Script->>Model: モデル初期化 (K=3など)
    Script->>Model: fit(x, y) を実行
    loop EMアルゴリズム
        Model->>Model: E-step (確率計算)
        Model->>Model: M-step (パラメータ更新)
        Model->>Model: 収束判定
    end
    Model-->>Script: フィッティング完了
    Script->>Model: plot(x, y)
    Model-->>User: グラフ表示
```

### インストール
必要なライブラリをインストールします。
```bash
pip install -r requirements.txt
```

### 基本的な使い方
Pythonスクリプト内で `EMPeaks` パッケージをインポートして使用します。

```python
from EMPeaks import GaussianMixture
import numpy as np

# データの準備
x = ...
y = ...

# モデルの作成とフィッティング
gmm = GaussianMixture.GaussianMixtureModel(K=3) # Kはピーク数
gmm.fit(x, y)

# 結果のプロットなど
gmm.plot(x, y)
```

### デモの実行
`marimo` を使用したデモを実行することで、ブラウザ上でインタラクティブに動作確認ができます。

```bash
marimo run empeaks_demo.py
```
または、編集モードで起動する場合:
```bash
marimo edit empeaks_demo.py
```

## 4. 参考文献
本パッケージのアルゴリズム詳細については、以下の論文を参照してください。
- Sci. Tech. Adv. Mater. 20, 733-735 (2019)
- Sci. Tech. Adv. Mater. method 1, 45 (2021)

# API リファレンス

本パッケージの主要なクラスと関数について説明します。
多くのモデルクラスは `EMCore` クラスを継承しており、共通のインターフェースを持っています。

### クラス継承関係

```mermaid
classDiagram
    class EMCore {
        +fit(x, y)
        +predict(x)
        +plot(x, y)
        +sampling(x, y)
    }
    class GaussianMixtureModel {
        +__init__(K, ...)
    }
    class LorentzianMixtureModel {
        +__init__(K, ...)
    }
    
    EMCore <|-- GaussianMixtureModel
    EMCore <|-- LorentzianMixtureModel
```

## GaussianMixtureModel

ガウス分布混合モデルを扱うクラスです。

```python
from EMPeaks import GaussianMixture
gmm = GaussianMixture.GaussianMixtureModel(K=3, background='linear')
```

### 初期化 (`__init__`)

```python
GaussianMixtureModel(K=2, x_min=-300, x_max=300, sigma_min=0.1, sigma_max=50, background='none', k_ramp=5)
```

- **K** (int): ピークの数。
- **x_min**, **x_max** (float): 解析するX軸（エネルギーなど）の範囲。
- **background** (str): バックグラウンドモデルの種類。
    - `'none'`: バックグラウンドなし。
    - `'uniform'`: 一様分布。
    - `'linear'`: 線形（勾配あり）。
    - `'ramp_sum'`: Ramp-Sumモデル（階段状）。
- **sigma_min**, **sigma_max** (float): ガウス分布の幅（標準偏差）の制約範囲。

### 主要メソッド

#### `fit(x, intensity, method='adapted_em', ...)`

データに対してモデルをフィッティングします。

```mermaid
flowchart TD
    Start[開始] --> Init[初期値設定<br/>(sampling等)]
    Init --> LoopStart{収束ループ}
    LoopStart --> EStep[E-step: 所属確率の計算]
    EStep --> MStep[M-step: パラメータ更新]
    MStep --> CalcLL[尤度(Log-Likelihood)計算]
    CalcLL --> Check{収束判定<br/>(変化 < r_eps?)}
    Check -- No --> LoopStart
    Check -- Yes --> End[終了]
```

- **x** (array-like): X軸データ。
- **intensity** (array-like): Y軸データ（強度）。
- **method** (str): フィッティング手法。
    - `'adapted_em'`: Spectrum Adapted EMアルゴリズム（推奨）。
    - `'smart'`: サンプリング -> EM -> 最小二乗法 を組み合わせた高精度な手法。
    - `'leastsq'`: 最小二乗法。
- **trial** (int): `method='smart'` の場合の初期値サンプリング試行回数。

戻り値: フィッティング結果の情報を含む辞書（Log-Likelihood, RMSEなど）。

#### `predict(x)`

現在のモデルパラメータに基づいて、指定されたX座標での計算値（強度）を返します。

- **x** (array-like): 計算したいX座標。
- **戻り値**: 計算されたY値（numpy array）。

#### `plot(x_data, intensity)`

データとフィッティング結果をプロットして表示します。

- **x_data**: プロットするデータのX軸。
- **intensity**: プロットするデータのY軸。

#### `sampling(x, intensity, trial=10, ...)`

ランダムな初期値を用いて複数回フィッティングを行い、最も良い結果（尤度が高い、またはRMSEが低い）を採用します。局所解を避けるために有効です。

- **trial** (int): 試行回数。

## その他のモデル

以下のモデルも同様のインターフェースで使用可能です。

- **LorentzianMixtureModel**: ローレンツ分布混合モデル
- **PseudoVoigtMixtureModel**: 擬Voigt分布混合モデル
- **DoniachSunjicMixtureModel**: Doniach-Sunjic分布混合モデル

これらは `EMPeaks.LorentzianMixture` などのサブパッケージからインポートできます。

# 依存関係とリスク管理

本プロジェクトが依存しているライブラリと、それらに起因する潜在的なリスク（「何もしていないのに壊れた」を防ぐための情報）について記述します。

## 1. 主要な依存ライブラリ

`requirements.txt` および `setup.cfg` に基づく主要な依存関係は以下の通りです。

```mermaid
graph LR
    App[EMPeaks] --> NP[NumPy >= 1.21.6]
    App --> SP[SciPy >= 1.7.3]
    App --> MP[Matplotlib >= 3.5.3]
    App --> PD[Pandas >= 1.2.3]
    
    style NP fill:#ffcccc,stroke:#f00,stroke-width:2px
    style SP fill:#ffcccc,stroke:#f00,stroke-width:2px
```

| ライブラリ | 指定バージョン | 役割 | リスク度 |
| :--- | :--- | :--- | :--- |
| **NumPy** | `>= 1.21.6` | 数値計算の基盤。配列操作など。 | **高** |
| **SciPy** | `>= 1.7.3` | 科学技術計算。最適化 (`optimize`) や積分 (`integrate`) で使用。 | **高** |
| **Matplotlib** | `>= 3.5.3` | グラフ描画。`plot` メソッドなどで使用。 | 中 |
| **Pandas** | `>= 1.2.3` | データ操作（現状のコードでは必須性は低いが指定あり）。 | 中 |

## 2. 潜在的なリスクと対策

### バージョン固定の欠如による破損
現在の `requirements.txt` では `>=` (以上) という指定のみが行われています。
これにより、**新しいメジャーバージョンがリリースされた際に、自動的に互換性のないバージョンがインストールされる** 可能性があります。

```mermaid
sequenceDiagram
    participant Dev as 開発環境
    participant Repo as PyPI (リポジトリ)
    participant Prod as 運用環境
    
    Note over Dev: NumPy 1.24で動作確認
    Dev->>Prod: requirements.txt (numpy>=1.21) を共有
    Note over Repo: NumPy 2.0 (破壊的変更あり) がリリース
    Prod->>Repo: pip install -r requirements.txt
    Repo-->>Prod: NumPy 2.0 をインストール (最新のため)
    Prod->>Prod: 実行 -> エラー発生！
    Note over Prod: 「何もしていないのに壊れた」
```

#### 具体的なリスク例
- **NumPy 2.0**: NumPyはメジャーバージョンアップで古いAPI（例えば `np.float` などの型エイリアス）を削除することがあります。これにより、コードが突然動かなくなる可能性があります。
- **SciPyの仕様変更**: `scipy.optimize` や `scipy.integrate` の関数の引数や戻り値の仕様が変更されることがあります。

### 対策推奨事項

1.  **バージョンの固定 (Pinning)**
    運用環境では、動作確認が取れているバージョンを厳密に指定することを推奨します。
    例: `numpy==1.24.3`

2.  **仮想環境の分離**
    開発や実行を行う際は、必ず `venv` や `conda` 等でプロジェクト専用の仮想環境を作成し、システム全体のPython環境（Global環境）の影響を受けないようにしてください。

3.  **定期的な依存関係の更新テスト**
    「何もしていないのに壊れる」を防ぐため、定期的に新しいバージョンのライブラリでテストを実行し、警告（DeprecationWarning）が出ていないか確認してください。

## 3. Pythonバージョン
`setup.cfg` により、**Python 3.8以上** が必須とされています。
古いPython環境（3.7以下）では動作しない、または依存ライブラリがインストールできない可能性があります。

# EMCore 詳細ドキュメント

`EMCore` クラスは EMPeaks ライブラリの中核であり、EM（期待値最大化）アルゴリズムを用いたスペクトルのピークフィッティング機能を提供します。

---

## 🚀 クイックスタート

最も一般的な使い方を3ステップで紹介します。

```python
from EMPeaks.GaussianMixture import GaussianMixtureModel
import numpy as np

# ① データの準備
x = np.linspace(0, 100, 500)
y = ...  # スペクトルデータ

# ② モデル作成（ピーク数を指定）
model = GaussianMixtureModel(K=3, background='linear')

# ③ フィッティング実行
result = model.fit(x, y, method='smart')
model.plot(x, y)  # 結果を可視化
```

### 💡 どのメソッドを使えばいい？

```mermaid
flowchart TD
    Start[フィッティングしたい] --> Q1{データの品質は？}
    Q1 -->|ノイズが少ない| A1["method='adapted_em'<br/>(高速・基本)"]
    Q1 -->|ノイズが多い/複雑| Q2{計算時間の余裕は？}
    Q2 -->|ある程度OK| A2["method='smart'<br/>(推奨・高精度)"]
    Q2 -->|なるべく高速に| A3["method='adapted_em' + sampling<br/>(バランス型)"]
    
    style A2 fill:#90EE90,stroke:#228B22,stroke-width:2px
```

> **おすすめ**: 迷ったら `method='smart'` を使ってください。初期値探索→EM→最小二乗法を自動で組み合わせ、高精度な結果を得られます。

---

## 📊 クラス概要

```mermaid
classDiagram
    direction LR
    class EMCore {
        K : ピーク数
        model : モデルリスト
        pi : 混合比
        fit() フィッティング実行
        predict() 予測値計算
        plot() 結果プロット
    }
    
    class Gaussian {
        mu : 中心位置
        sigma : 幅
    }
    
    class Background {
        Uniform
        Linear
        RampSum
    }
    
    EMCore *-- Gaussian : K個
    EMCore *-- Background : 0〜1個
```

### 主な機能

| 機能 | 説明 |
|:---|:---|
| **モデル構築** | ガウスピーク（K個）+ 背景モデルの組み合わせ |
| **パラメータ推定** | EMアルゴリズムによる最尤推定 |
| **高度な手法** | サンプリング、決定論的アニーリング、最小二乗法 |
| **可視化** | Matplotlib によるプロット機能 |

---

## ⚙️ 初期化パラメータ

### `__init__()` のパラメータ一覧

| パラメータ | 型 | デフォルト | 説明 |
|:---|:---|:---|:---|
| `K` | int | 2 | ピークの数 |
| `x_min` | float | -300 | X軸の最小値 |
| `x_max` | float | 300 | X軸の最大値 |
| `sigma_min` | float | 0.1 | ピーク幅の下限 |
| `sigma_max` | float | 50 | ピーク幅の上限 |
| `background` | str | 'none' | 背景モデルの種類 |
| `k_ramp` | int | 5 | RampSum用のランプ数 |

### 背景モデルの種類

| 値 | 説明 | 使用場面 |
|:---|:---|:---|
| `'none'` | 背景なし | ベースラインが0のデータ |
| `'uniform'` | 一定値 | フラットなバックグラウンド |
| `'linear'` | 線形（傾き付き） | 傾斜したベースライン |
| `'ramp_sum'` | 階段状 | XPSなど複雑な背景 |

---

## 🔧 メソッド一覧

### フィッティング系（最重要）

#### `fit(x, intensity, method='adapted_em', ...)`

**メインのフィッティングメソッド**

| 引数 | 型 | 説明 |
|:---|:---|:---|
| `x` | array | X軸データ |
| `intensity` | array | Y軸データ（強度） |
| `method` | str | フィッティング手法（下表参照） |
| `max_iter` | int | 最大反復回数（デフォルト: 100） |
| `r_eps` | float | 収束判定の閾値（デフォルト: 1e-4） |
| `trial` | int | サンプリング試行回数（smartの場合） |

**method の種類**

| method | 速度 | 精度 | 説明 |
|:---|:---|:---|:---|
| `'adapted_em'` | ⚡高速 | 〇 | 基本のEMアルゴリズム |
| `'smart'` | 普通 | ◎ | サンプリング→EM→最小二乗法（**推奨**） |
| `'leastsq'` | 普通 | 〇 | 最小二乗法のみ |
| `'l2div'` | 普通 | 〇 | L2ダイバージェンス最小化 |

**使用例**

```python
# 基本的な使い方
result = model.fit(x, y, method='smart', trial=10)

# 結果の確認
print(f"RMSE: {result['RMSE']:.4f}")
print(f"ピーク位置: {result['mu']}")
```

---

#### `sampling(x, intensity, trial=10, ...)`

**複数の初期値で試行し、最良の結果を選択**

局所解を避けたい場合に有効です。

```python
# 20回試行して最良の結果を採用
result = model.sampling(x, y, trial=20)
```

---

### 予測・評価系

#### `predict(x)`

現在のパラメータでモデルの予測値を計算します。

```python
x_fine = np.linspace(x.min(), x.max(), 1000)
y_pred = model.predict(x_fine)
```

#### `log_likelihood(x, intensity)`

対数尤度を計算します（モデルの当てはまりの良さの指標）。

---

### 可視化系

#### `plot(x_data, intensity)`

フィッティング結果をプロットします。

```python
model.plot(x, y)  # 元データ + 各ピーク + 合計曲線を表示
```

---

### パラメータ管理系

| メソッド | 説明 |
|:---|:---|
| `set_param(**param)` | パラメータを外部から設定 |
| `export_param()` | 現在のパラメータを辞書で取得 |
| `init_param_uniform()` | パラメータをランダム初期化 |

**パラメータの取得例**

```python
params = model.export_param()
print(f"ピーク位置: {params['mu']}")
print(f"ピーク幅: {params['sigma']}")
print(f"混合比: {params['pi']}")
```

## 📝 実践的な使用例

### 例1: 基本的なピークフィッティング

```python
from EMPeaks.GaussianMixture import GaussianMixtureModel
import numpy as np

# サンプルデータ生成
x = np.linspace(0, 100, 500)
y = (50 * np.exp(-((x-30)**2)/(2*5**2)) + 
     80 * np.exp(-((x-60)**2)/(2*8**2)) + 
     np.random.normal(0, 2, len(x)))

# フィッティング
model = GaussianMixtureModel(K=2, x_min=0, x_max=100, background='uniform')
result = model.fit(x, y, method='smart', trial=10)

# 結果確認
print(f"ピーク1: 位置={result['mu'][0]:.2f}, 幅={result['sigma'][0]:.2f}")
print(f"ピーク2: 位置={result['mu'][1]:.2f}, 幅={result['sigma'][1]:.2f}")

model.plot(x, y)
```

### 例2: XPSスペクトル解析（背景あり）

```python
# XPSデータでは ramp_sum 背景がよく使われます
model = GaussianMixtureModel(
    K=4,  # 4つのピーク
    x_min=280, x_max=295,  # 結合エネルギー範囲
    background='ramp_sum',
    k_ramp=10
)

result = model.fit(x_xps, y_xps, method='smart', trial=20)
```

### 例3: パラメータの初期値を指定

```python
model = GaussianMixtureModel(K=2)

# 既知の初期値を設定
model.set_param(
    mu=[30, 60],      # ピーク位置の初期推定
    sigma=[5, 8],     # ピーク幅の初期推定
    pi=[0.4, 0.6]     # 混合比
)

# その初期値からフィッティング開始
result = model.fit(x, y, method='adapted_em')
```

---

## ⚠️ 注意点とTips

> **💡 ピーク数Kの選び方**
> 
> Kが大き過ぎると過学習、小さ過ぎるとフィットが悪くなります。
> 複数のKで試して、RMSEやBICを比較するのがベストです。

> **💡 収束しない場合**
> 
> - `max_iter` を増やす（デフォルト100→500など）
> - `method='smart'` で `trial` を増やす
> - 初期値を `set_param()` で手動設定

> **💡 計算が遅い場合**
> 
> - データ点数を減らす（ダウンサンプリング）
> - `trial` を減らす
> - `method='adapted_em'` を使用

def _create_background_model(self, background_type: str) -> list:
    """背景モデルを生成するファクトリメソッド"""
    if background_type == 'none':
        return []
    elif background_type == 'uniform':
        return [UniformModel(self.x_min, self.x_max)]
    elif background_type == 'linear':
        return [LinearModel(self.x_min, self.x_max)]
    else:
        raise ValueError(f"Unknown background type: {background_type}")
```
